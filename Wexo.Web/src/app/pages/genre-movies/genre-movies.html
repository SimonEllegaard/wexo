<h2>{{ genre.name }} ({{ totalResults}} total)</h2>
<div class="movie-list">
  <div *ngFor="let movie of movies">
    <movie-card [movie]="movie"
                [imageUrlBase]="configuration.images.secure_base_url + configuration.images.poster_sizes[2]">
    </movie-card>
  </div>
</div>
<div class="pagination">
  <button *ngIf="page > 1" (click)="previousPage()"> < </button>
    {{page}} of {{totalPages}}
  <button *ngIf="page < totalPages" (click)="nextPage()"> > </button>
</div>
