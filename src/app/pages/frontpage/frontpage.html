<div *ngFor="let genre of genres" class="genre-section">
  <div class="genre-header">
    <h2>{{ genre.name }}</h2>
    <a [routerLink]="['/genre', genre.id]">View all {{ genre.name }} ({{ genreCount[genre.name] }})</a>
  </div>

  <div class="movie-row-container">
    <button
      (click)="scroll(movieRow, 'left')"
      aria-label="Scroll left"
      class="scroll-button left">
      ‹
    </button>
    <div #movieRow class="movie-row">
      <div *ngFor="let movie of genreMovies[genre.name]" [routerLink]="['/movie', movie.id]"
           class="movie-card-container">
        <movie-card [imageUrlBase]="configuration.images.secure_base_url + configuration.images.poster_sizes[2]"
                    [movie]="movie">
        </movie-card>
      </div>
    </div>
    <button
      (click)="scroll(movieRow, 'right')"
      aria-label="Scroll right"
      class="scroll-button right">
      ›
    </button>
  </div>
</div>
