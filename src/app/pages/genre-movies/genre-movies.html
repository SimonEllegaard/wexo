<h2>{{ genre.name }} ({{ totalResults }} total)</h2>
<div class="movie-list">
  <div *ngFor="let movie of movies">
    <movie-card [imageUrlBase]="configuration.images.secure_base_url + configuration.images.poster_sizes[2]"
                [movie]="movie">
    </movie-card>
  </div>
</div>
<div class="pagination">
  <button (click)="previousPage()" *ngIf="page > 1"> <</button>
  {{ page }} of {{ totalPages }}
  <button (click)="nextPage()" *ngIf="page < totalPages"> ></button>
</div>
